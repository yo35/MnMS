name: Deploy to PyPI

on:
  push:
    branches:
      - 'feature/docker' # TODO docker remove
    tags:
      - 'v*.*.*' # Trigger on version tags like v1.2.3

jobs:

  # TODO docker restore check-version

  build:
    name: Build wheel & source distribution
    runs-on: ubuntu-latest
    # TODO docker restore needs: -check-version

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x' # The exact Python version is not important here.

      - name: Build wheel & sdist
        run: |
          pip install --group distrib
          python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: |
            ./dist/*.tar.gz
            ./dist/*.whl

  # TODO docker restore publish-pypi

  publish-ghcr:
    name: Publish (Docker image) to container registry
    runs-on: ubuntu-latest
    needs: # TODO docker restore needs: -check-version
      - build

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: yo35/mnms # TODO docker change image name

    # TODO docker add environment

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist

      - uses: docker/setup-qemu-action@v4 # Needed to build the arm64 image version from a linux/amd64 runner.
      - uses: docker/setup-buildx-action@v4

      - name: Read image labels
        id: labels
        run: |
          {
            echo 'labels<<EOF'
            grep -v -e '^\s*#' -e '^\s*$' docker/image_src/labels.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Compute image tags and metadata
        id: metadata
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index # Needed for metadata to be properly set on multi-platform image.
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The image version is the MnMS version, taken from the git tag without its 'v' prefix.
          tags: | # TODO docker restore type=semver,...
            type=raw,value=latest
            type=sha
          labels: ${{ steps.labels.outputs.labels }}
          annotations: ${{ steps.labels.outputs.labels }}

      - name: Build image and push
        uses: docker/build-push-action@v7
        with:
          context: docker/image_src
          build-contexts: wheel_dir=dist # Directory containing the MnMS wheel to install in the image.
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          provenance: false # Avoid the extra 'unknown/unknown' entry in the image index.
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
